name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32, MSVC)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-$($env:GITHUB_SHA.Substring(0,7))" }
          $pkg = "pkg"
          New-Item -ItemType Directory -Force "$pkg/Drivers" | Out-Null
          Copy-Item build/Release/nfs5_enhanced.asi $pkg/
          Copy-Item build/Release/SDL3.dll $pkg/
          Copy-Item config/nfs5_enhanced.ini $pkg/
          Copy-Item build/drivers/dx11/Release/dx11z.dll "$pkg/Drivers/"
          Copy-Item README.md, CHANGELOG.md, LICENSE $pkg/
          Copy-Item external/SDL3/LICENSE.txt "$pkg/SDL3-LICENSE.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "nfs5_enhanced_LHedit_$name.zip"
          "ZIP=nfs5_enhanced_LHedit_$name.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: nfs5_enhanced_LHedit
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}

; lfsp.ini – LFSP (Love for Speed Porsche), liegt neben lfsp.asi im Spielordner.
; Beschreibung: doc/FENSTER-VERDECK.md, doc/LICHT.md, doc/KAMERA.md, doc/BUGS.md
; Tasten: Buchstabe oder Ziffer (F, 7), F1..F24 oder Hexcode (0x46). Im Spiel belegt sind u. a. L (Licht), T, W, E, C.
; Fehlt ein Schlüssel, gilt die eingebaute Vorgabe (für LFSP die Werte dieser Vorlage).

[General]
; ---- Seitenscheiben und Verdeck ----
; Taste und Dauer für den ganzen Weg in ms
WindowKey = F
WindowTime = 1200
RoofKey = V
RoofTime = 2200
; Verdeck-Taste auch im Menü (0 = nur im Rennen, im Menü gibt es einen eigenen Knopf)
RoofKeyInMenu = 0
; Wirkung im Rennen: 0 = nur eigenes Auto, 1 = alle Autos (im Menü immer das gezeigte Auto)
ApplyTo = 0

; ---- Geräusche ----
; WAV oder MP3, Pfad relativ zum Spielordner (fehlt die Datei, wird die andere Endung versucht; leer = aus),
; Lautstärke in Prozent
RoofSoundOpen = lfsp_roof_open.wav
RoofSoundClose = lfsp_roof_close.wav
WindowSound = lfsp_window.wav
RoofVolume = 40
WindowVolume = 50

; ---- Experten: Bewegung der Scheibe (in Scheibenhöhen) ----
; Neigung beim Absenken: Querachse 0/1/2 = x/y/z; 1.0 = wie gemessen, 0 = senkrecht, größer = stärker nach außen
WindowSideAxis = 0
WindowTilt = 1.0
; Weg (etwas mehr als 1, damit die Oberkante sicher in der Tür verschwindet)
WindowDepth = 1.05
; Weg als Ganzes unter die Türkante, bevor die Scheibe gestaucht wird (größer kann durch das Türblech stechen)
WindowSink = 0.33
; Versatz nach vorn am Ende (0 = aus) und Richtung "vorn" auf der Längsachse z (-1 oder 1)
WindowForward = 0.15
WindowForwardSign = -1

; ---- Debug ----
; Messlog lfsp.log: 1 = an, 0 = aus
Measure = 1
; Neuaufbau nach dem Umschalten: 1 = Teile-Liste, 2 = zusätzlich Textur-Seiten neu zeichnen
RebuildMode = 1
; Geometrie: 1 = vorhandene Render-Schichten neu befüllen, 2 = neu anlegen wie das Menü (setzt die Teile zurück, nur Test)
RebuildMethod = 1
; Scheiben: 1 = in die Tür fahren, 0 = sofort umschalten
WindowAnimate = 1
; Achse "oben/unten" der Modelldaten (0/1/2 = x/y/z) und Richtung "unten" (-1 oder 1)
WindowAxis = 1
WindowDownSign = -1


[Lights]
; ---- Scheinwerfer (berechnet von drivers\dx11z.dll) ----
; 0 = wie das Spiel (Licht an den Ecken der Dreiecke), 1 = pro Pixel, 2 = beides zum Vergleich
Headlights = 1
; Bei Tag: 0 = aus, 1 = wenn der Lichtschalter an ist, 2 = immer
HeadlightsDay = 1
; Tag-Licht: Helligkeit als Anteil der Nacht (0-4), Farbe RRGGBB (Spiel: 808080), Reichweite (0.25-4)
HeadlightsDayStrength = 1.0
HeadlightsDayColour = 808080
HeadlightsDayRange = 0.9
; Lichtkarte (Graustufen-BMP, unten = vor dem Auto, oben = fern), leer = Karte des Spiels.
; drivers\headlights_original.bmp ist die Karte des Spiels als Vorlage.
HeadlightsMap = drivers\headlights_low.bmp
; Gegner beleuchten die Strecke, wenn ihr Licht an und heil ist (1 = an); Helligkeit als Anteil des eigenen Lichts (0-4)
HeadlightsOpponents = 1
HeadlightsOpponentsStrength = 1.0
; Verkehrsautos: schwacher Lichtwurf der Scheinwerfer nach vorn, Anteil am Gegnerlicht (0 = aus). Nur in Nachtrennen, nach den Gegnern,
; die nächsten Verkehrsautos zuerst, höchstens 7 Lichter insgesamt
TrafficHeadlightGlow = 0.35
; Reichweite des Verkehrslichts nach vorn als Anteil der Gegner-Reichweite (0.1-2, 1 = wie Gegner)
TrafficHeadlightRange = 0.5
; Höchstzahl der Fahrzeuglichter auf der Strecke (Gegner und Verkehr zusammen, 1-16). Aufgenommen werden nur Autos im Umkreis von 100 Einheiten
; um die Kamera, die nächsten zuerst, Gegner vor Verkehr. Je Licht ein Kartenzugriff pro Pixel; bei Bildrateneinbruch senken
MaxCarLights = 16
; Lichter, die ein Zeichenaufruf nicht erreichen kann, gar nicht erst an den Shader geben (rechnet nur Lichter ein, deren Bereich die Hüllkugel
; des Aufrufs berührt: kein sichtbarer Unterschied, spart Pixel-Arbeit). 1 = an, 0 = alle Lichter an jeden Aufruf
LightCulling = 1
; Nacht auf Tagstrecke: normal überblendete Draws ohne Tiefenschreiben (Laubsaum, ferne Büsche) mit abdunkeln (1) oder hell lassen (0)
NightGradeBlended = 1
; Aufrufe ohne Alpha-Test (nichts im Shader kann sie verwerfen) mit erzwungenem frühem Tiefentest zeichnen (Shader Model 5, Feature Level 11).
; Kein Unterschied im Bild; 0 = wie bisher
; EarlyZ: 0 aus, 1 nur Aufrufe ganz ohne Alpha-Test, 2 zusätzlich Aufrufe mit Alpha-Test, den die Textur nicht verlieren kann (kleinstes Alpha der Textur
; über dem Referenzwert, Vertexalpha 255, Texturfaktor 255). Nichts davon ändert das Bild
EarlyZ = 2
; AlphaEdgeFix = 3 (Alpha-to-Coverage) nur für Texturen, deren Alpha fast nur 0 oder 255 ist (Laub, Zäune): Anteil der Texel mit Alpha 32 bis 224,
; über dem Wert bleibt der Zwei-Pass-Weg (Wasserkanten, Schatten, Rauch, Glas). Ausblendung über die Vertexfarbe zählt ebenfalls als Verlauf
AlphaCoverageMid = 0.12
; Bilder je Sekunde ohne Messung (ohne Queries): alle N Sekunden eine Zeile Fps im dx11z.log (Mittel, schlechtester Frame), 0 = aus
FpsLog = 0
; Messmodus: alle N Sekunden (0 = aus) GPU-Zeit je Aufrufart (Welt, Welt mit Licht, Himmel, additiv, HUD, Kantenfix) und CPU-Zeit der
; Licht-Konstanten ins dx11z.log. Kostet selbst etwas, nur zum Messen
FrameProfile = 0
; Scheinwerfer beleuchten auch Autos, Schilder und Objekte (1 = an, 0 = nur die Strecke, 2 = an und diese Flächen
; 4-fach hell zum Erkennen)
HeadlightsObjects = 1

; ---- Fernlicht ----
; Taste gedrückt halten; bei ausgeschaltetem Licht wirkt sie als Lichthupe
HeadlightsHighKey = K
; Höhe an Wänden (2 = doppelt so hoch, 0.5-10), Helligkeit (0-4), Reichweite (1-4) und Breite
; (je 1 = wie Abblendlicht), Überblenden in ms
HeadlightsHighHeight = 5
HeadlightsHighStrength = 1.3
HeadlightsHighRange = 1.4
HeadlightsHighWidth = 1.2
HeadlightsHighFade = 100
; Lichthupe öffnet die Klappscheinwerfer (944, 928 …), Heckleuchten bleiben aus (1 = an, 0 = Klappen bleiben zu)
HeadlightsFlashPopUps = 1

; ---- Rücklicht-Schein ----
; Roter Schein hinter jedem Auto, beim Bremsen stärker; Blinker vorn und hinten im Takt und in der Farbe ihrer
; Leuchte; eine beschädigte Leuchte strahlt nicht (1 = an)
TailGlow = 1
; Farbe RRGGBB (Rück- und Bremslicht); Stärke Rücklicht bei ausgeschaltetem Licht (0 = kein Schein), zusätzlich bei
; eingeschaltetem Licht, zusätzlich beim Bremsen, Blinker (0-4)
TailGlowColour = FF1A0A
TailGlowStrength = 0
TailGlowLights = 0.2
TailGlowBrake = 0.3
TailGlowSignals = 0.3
; Rückfahrlicht (nur Autos mit Rückfahrscheinwerfer, in der Farbe der Leuchte), Stärke (0-4)
TailGlowReverse = 0.35
; Form: Abstand hinter der Wagenmitte, Abfall nach hinten, Abstand der Leuchten von der Mitte, Breite je Leuchte
TailGlowOffset = 2.1
TailGlowReach = 1.5
TailGlowWidth = 0.6
TailGlowSpread = 0.5

; Blinker hinten im Takt der vorderen (das Spiel blinkt sie gegenphasig): 1 = an, 0 = wie das Spiel
SignalsInSync = 1

; 3. Bremslicht (mittig, z. B. im Heckfenster) nur beim Bremsen; das Spiel lässt es bei eingeschaltetem
; Licht als Rücklicht mitleuchten (1 = an, 0 = wie das Spiel)
ThirdBrakeLightBrakingOnly = 1

; Glow (Lens-Flare) der eigenen Scheinwerfer bei Fernlicht: Helligkeit und Größe × Faktor (1 = wie Abblendlicht, bis 4)
HeadlightsHighGlow = 1.6

; ---- HUD ----
; Tacho und Drehzahlmesser: Tag-/Nachtfassung folgt dem Lichtschalter (L), nicht der Lichthupe
; (1 = an, 0 = wie das Spiel nach Tageszeit)
InstrumentsFollowLights = 1

; ---- Lichtfarbe nach Baujahr (eigenes Auto und Gegner) ----
; 1 = an, 0 = Farbe des Spiels bzw. HeadlightsDayColour
HeadlightsColourByYear = 1
; YearN = Baujahr, Farbe RRGGBB, Helligkeit (1.0 = wie das Spiel). Dazwischen wird überblendet, davor und danach gilt
; der erste bzw. letzte Punkt. Nur der Farbton zählt, die Helligkeit kommt aus dem dritten Wert.
; Glühlampe 6 V (~2400 K), Halogen H4 (~3100 K), Halogen verbessert (~3400 K), Xenon (~4500 K)
Year1 = 1950, FFA54F, 0.5
Year2 = 1975, FFC184, 0.8
Year3 = 1995, FFCC99, 1.0
Year4 = 1997, FFF0E0, 1.3


[World]
; Strecke: 0 = wie das Spiel, 1 = immer feinste Detailstufe (keine Risse in der Ferne),
; 2 = zusätzlich nichts nach Entfernung ausblenden (zeigt auch sehr ferne Teile), 3 = immer gröbste Stufe (Test B21)
TrackDetail = 1
; Bei TrackDetail = 1: Reichweite je Abschnitt x Faktor gegen Löcher (1.0 = wie das Spiel; zu groß zeigt mehr ferne Teile)
TrackRange = 1.5
; Diagnose B21: 0 = aus, 1 = verworfene Strecken-Objekte ins Log, Taste: Stufen-Tabellen der Abschnitte im Umkreis 150,
; 2 = zusätzlich zeichnen
TrackDiag = 0
TrackDiagKey = G
; Diagnose B21: Dreieck-Clipper gegenprüfen, verlorene sichtbare Dreiecke ins Log (1 = an, 0 = aus)
ClipDiag = 0
; DistanceKey: Taste schaltet die Entfernungsmessung (dx11z) an/aus: Fadenkreuz an der Maus, Abstand in Metern; Zeichen, INSERT, HOME, END, PAUSE oder 0x..; leer = aus
DistanceKey = INSERT
; GuardBand: Dreiecke am Bildrand ganz an dx11z geben statt auf der CPU zu schneiden (0 = wie das Spiel; 1 stört Rückspiegel, Minimap und ESC-Menü im Replay, die Wasserspiegelung braucht es nicht mehr)
GuardBand = 0
; CullRadiusScale: Objekte knapp neben dem Bild trotzdem zeichnen (Radius-Faktor im Sichtfeld-Test, für die Wasserspiegelung am Rand; 1 = wie das Spiel)
CullRadiusScale = 2.0
; Clip-Rechteck der Polygone je Seite um diesen Anteil der Bildgröße erweitert, damit Teile neben dem Bild gespiegelt werden (0 = Bildrand, nur mit GuardBand = 1)
ClipMargin = 1
; SkidDepthBias: Reifenspuren um diesen Anteil des Abstands zur Kamera nach vorn ziehen, damit die Fahrbahn sie nicht verdeckt (B22, dx11z; 0 = wie das Spiel)
SkidDepthBias = 0.003
; TextureLodBias: feine Texturen flimmern in flachem Winkel (HD-TEXTUREN.md). Wert > 0 nimmt früher die kleinere Mip-Stufe
; (0.5 = leicht, 1 = deutlich weicher; 0 = wie das Spiel). Gilt nur für Texturen mit Mip-Stufen, nicht für HUD und Menü.
TextureLodBias = 0
; ForceMips: Mip-Stufen auch nutzen, wo das Spiel den Mip-Filter ausschaltet (1 = an, 0 = wie das Spiel)
ForceMips = 0


[Water]
; Echte Wasserspiegelung (B15): Objekte werden an der Wasserebene gespiegelt neu gezeichnet (1 = an, 0 = wie das Spiel).
; Braucht lfsp.asi ab v7f und dx11z mit Wasserspiegelung.
Reflections = 1
; Deckkraft der Spiegelung auf dem Wasser (0 … 1)
ReflectionStrength = 0.6
; Farbfilter der Spiegelung als RRGGBB (FFFFFF = unverändert, kleiner = dunkler/getönt)
ReflectionTint = C8D2DC
; Fertige, unscharfe Spiegel-Kopien des Spiels weglassen (1 = weg, 0 = zusätzlich zeigen)
RemoveBakedReflections = 1
; Texturen dieser Spiegel-Kopien (Hash aus dem Messlog, durch Komma getrennt). Andere halbtransparente
; Teile der Strecke (z. B. Baumstreifen auf Felsen) bleiben stehen
BakedTextures = 41C66523,92CDBBAB
; Texturen der Wasserfläche (Hash aus dem Messlog, durch Komma getrennt)
WaterTextures = 28A6F8AA
; Ufer-Texturen: ihr durchsichtiger Wasser-Teil (Alpha unter 0,5) spiegelt mit (Hash, durch Komma getrennt)
ShoreTextures = 63B3CF44
; Ufer zum Wasser hin ausblenden: Alpha unter diesem Wert wird durchsichtig (etwa die unteren 20 %; 0 = wie im Original)
ShoreFade = 0.27
; Wasserfläche zum fernen Ende hin ausblenden: Anteil der Sichtweite des Wassers, über den sie verläuft (0 = harte Kante)
FarFade = 0.3
; Wo die Wasserfläche gegen offenen Himmel endet (Kartenende, Meer im Himmel), über so viele Bildpunkte (bei 1080 Zeilen) in den Himmel daneben überblenden (0 = harte Kante)
EdgeFade = 120
; Texturen, die nicht gespiegelt werden (hex, durch Komma getrennt; leer = alle)
ReflectionSkip =
; Fernes Meer: bekommt die Spiegelung wie Wasser, zählt aber nicht für die Wasserebene (ist nicht überall flach; hex, durch Komma getrennt)
FarWaterTextures = 28884AC8
; Wo die gespiegelte Szene leer ist (nie gezeichnet), den gespiegelten Himmel zeigen (1 = an, 0 = aus)
ReflectionSky = 1
; Gespiegelte Szene beidseitig zeichnen: die Spiegel-Kamera sieht von unten Flächen, die das Spiel weglässt (1 = an, 0 = aus)
ReflectionTwoSided = 1
; Wellen in der Spiegelung: Ausschlag in Bildpunkten bei 1080 Zeilen (0 = ruhig)
ReflectionWaves = 1
; Unschärfe der Spiegelung in Bildpunkten bei 1080 Zeilen (0 = scharf)
ReflectionBlur = 3
; Auflösung der Spiegelung als Anteil der Bildauflösung (0.5 = halb, schneller; 1 = voll)
ReflectionScale = 0.5
; Fresnel: Anteil der Spiegelung beim Blick senkrecht von oben (1 = überall gleich stark)
ReflectionFresnel = 0.3
; Spiegelung beim Blick flach über das Wasser (Ferne, Horizont): Stärke, zu der sie dort ansteigt (1 = voll wie echtes Wasser, 0 = aus)
ReflectionGrazing = 1
; ---- Schneller (9.13d, ab Werk wie bisher) ----
; Gespiegelte Szene mit schlankem Shader ohne Scheinwerfer-, Gegner- und Rücklicht-Schleifen (die Spiegelung hat ohnehin keine Scheinwerfer; 1 = an, 0 = wie bisher)
ReflectionSimpleShader = 0
; Teile, die auf dem Bild kleiner sind als so viele Pixel (auf 1440 Zeilen bezogen, größte Kantenlänge), werden nicht gespiegelt (0 = alle).
; Teile ganz unter der Wasserfläche werden immer ausgelassen (die Spiegelung schneidet sie ohnehin weg)
ReflectionMinSize = 0
; Spiegelung auch im Rückspiegel (1 = an, 0 = im Rückspiegel keine Wasserspiegelung)
ReflectionMirrorView = 1
; Größe des Himmelsbilds für die Spiegelung: 1 = volle Bildauflösung, 0.5 = halb (der Himmel ist weich, halb reicht)
ReflectionSkyScale = 1
; ---- Lichter im Wasser (9.14a) ----
; Lampen, Leuchten und Lichtflecken (additive Draws) spiegeln sich im Wasser, verstärkt und mit Lichtstreifen nach unten (1 = an, 0 = aus)
ReflectionLights = 0
; Verstärkung der gespiegelten Lichter (1 = so hell wie die Lampe selbst)
ReflectionLightBoost = 3
; Länge der Lichtstreifen: Schrittweite der 6 Abtastungen in Bildpunkten bei 1080 Zeilen (0 = keine Streifen)
ReflectionLightStreak = 6


[CarReflections]
; Reflexionen auf den Autos (Phase 9, Stufe 1). Messung der Umgebungsschicht des Spiels: Umgebungsbilder des Spielerautos,
; jeder Draw damit nach Zustand, Bericht alle 10 s in Drivers/dx11z.log, Bilder als m3t_*.bmp daneben (1 = an, 0 = aus)
Measure = 0
; ---- Stufe 2 (9.12b): eigener Reflexions-Durchgang über der Karosserie (dx11z) ----
; Der Lack wird ein zweites Mal gezeichnet, mit dem Bild in Spiegelrichtung darüber (Fresnel: an flachen Winkeln stärker).
; 1 = an, 0 = aus
Reflections = 0
; Stärke 0..1 (Deckkraft der Spiegelung an streifenden Winkeln)
Strength = 0.8
; Anteil bei senkrechtem Blick 0..1 (Lack um 0.05..0.2, Chrom höher)
Reflectance = 0.15
; Übergang zwischen senkrechtem und flachem Blick: Exponent 1..8 (5 = physikalisch, kleiner = weicher, weniger harter Wechsel)
Fresnel = 3
; Unschärfe: Mip-Stufe der Bildkopie 0..8 (0 = scharfer Spiegel)
Blur = 2.0
; Stärke der Spiegelung nach unten (Boden) 0..1, 1 = wie nach oben
Ground = 0.35
; 1 = auch durchscheinende Pixel spiegeln (Scheiben), 0 = nur deckende
Glass = 0
; Bildkopie der Szene (Auflösen der 8x-MSAA-Szene und Mip-Kette, einmal je Bild) nur alle N Bilder erneuern (1 = jedes Bild, 2 = jedes zweite …). Die Spiegelung ist unscharf (Blur), die Kopie
; des Vorbilds sieht fast gleich aus; bei schneller Fahrt kann die Spiegelung hinterherhinken
UpdateInterval = 1
; Größe der Bildkopie: 1 = volle Auflösung, 0.5 = halb (schneller; die Unschärfe Blur rechnet um, das Bild bleibt etwa gleich)
SourceScale = 1
; Weiche Unschärfe-Kette (9.16a): Spiegelbild aus einer eigens weich gefilterten Kopie in halber Auflösung mit 5 Stufen statt aus den
; Mip-Stufen der Bildkopie (weicher, ohne Blockkanten; Blur wählt die Stufe; 1 = an, 0 = wie bisher)
BlurChain = 0
; Teile, die auf dem Bild kleiner sind als so viele Pixel (auf 1440 Zeilen bezogen, größte Kantenlänge), bekommen keine Spiegelung (0 = alle)
MinSize = 0
; Texturen ohne Spiegelung (Hash wie im Log), Standard: Lichtflecken Y2T1/Y2T2 des Spiels
SkipTextures = 4A522215,984E4128
; Matte Teile ohne Spiegelung (Teilnummer der .crp, wie im Log „pass … part T/V“), „T/V“ nur für eine Variante.
; Lack darin glänzt trotzdem: Dreiecke auf Stellen der Lack-Textur, die ein glänzendes Teil benutzt oder die etwa Lack- oder Streifenfarben der Karosserie haben,
; z. B. das Heck neben dem Verdeck des 356 (Teile 37/41); der Verdeckstoff auf derselben Textur bleibt matt.
; Standard: Stoffverdecke 37/41, Innenraum (9 Fahrer, 24–26, 28–30, 43–46, 49, 56, 59), Unterboden 11/12, Motor 15, Kofferraum 23/33
MatteParts = 9,11,12,15,23,24,25,26,28,29,30,33,37,41,43,44,45,46,49,56,59
; Zum Suchen: nur dieses Teil spiegeln (-1 = aus)
OnlyPart = -1
; Ansicht zum Prüfen: 0 = normal, 1 = Normalen, 2 = gespiegeltes Bild voll, 3 = Fresnel-Stärke
Debug = 0


[Camera]
; ---- Cinematic: Streckenkameras der Wiederholung, wechseln mit der Kamerazone ----
; 1 = fünfte Ansicht der Kamerataste des Spiels (C), 0 = nicht
CinematicInCycle = 1
; Eigene Taste zum Ein-/Ausschalten (leer = keine)
CinematicKey =
; Motor in Cinematic so laut wie in der Wiederholung (sonst hört man vor allem die Reifen), 1 = an, 0 = aus
CinematicEngineSound = 1

; ---- Action: Verfolgerkameras reagieren auf Kurve, Bremsen, Sprünge, Grund und Tempo ----
; 1 = an, 0 = aus; Taste zum Vergleichen an/aus (leer = keine)
Action = 1
ActionKey = J
; Kameratypen: 2, 3, 4 = Verfolger nah/mittel/fern, 5, 6, 7 = Heli nah/mittel/fern
ActionCams = 2, 3, 4
; Stärken, 0 = Effekt aus:
;   Side = Versatz in Kurven (Meter bei 1 g), Look = Blick in die Kurve (Grad bei 1 g), Height = höher als im Spiel (Meter),
;   Brake = Heranrücken beim Bremsen (Meter), Bounce = Mitschwingen bei Sprüngen, Fov = FOV-Zuwachs bei Tempo,
;   Shake = Wackeln auf unebenem Grund, Roll = Rollen zur Kurveninnenseite (Grad bei 1 g, negativ = nach außen),
;   Overshoot = Nachschwingen beim Einlenken (1 = Standard, 2 = stark), Impact = Stoß bei Aufprall und Landung
ActionSide = 1.0
ActionLook = 7.0
ActionHeight = 0.25
ActionBrake = 0.8
ActionBounce = 1.0
ActionFov = 0.20
ActionShake = 1.0
ActionRoll = 2.5
ActionOvershoot = 0.5
ActionImpact = 1.0
; Sekunden, bis der Kurven-Effekt aufgebaut ist (Tastatur: länger lenken = stärker)
ActionBuildUp = 1.2
; Kurven-Effekte bei hohem Tempo stärker (voll ab ~215 km/h, 0 = gleich stark)
ActionSpeedBoost = 0.35

; ---- Innenansichten (Cockpit, Stoßstange) ----
; FOV in Grad (Spiel: 75), 0 = nicht ändern
CockpitFov = 90

; ---- Außenansichten und Wiederholung ----
; Mindest-FOV in Grad: Streckenkameras zoomen sonst bei weit entfernten Autos beliebig eng (Spiel: keine Grenze);
; ist der Zoom enger, wird das Bild auf diesen Wert geweitet, 0 = aus
ReplayMinFov = 30

; ---- Freecam (Testzwecke) ----
; Taste an/aus (leer = keine). Numpad 8/5/4/6 vor/zurück/links/rechts, 9/3 hoch/runter, 7/1 Blick hoch/runter,
; Numpad / und * Blick links/rechts, Maus = Blick (das Spiel bekommt dann keine Maus), Mausrad = Tempo,
; Numpad + / - = FOV, Numpad 0 = zurück zur Kamera des Spiels; Umschalt schnell (FreeCamFast), Strg x0,2.
; Das Auto fährt mit den Eingaben weiter, der Rückspiegel bleibt beim Auto.
FreeCamKey = F9
; Tempo in m/s, Faktor mit Umschalt, FOV in Grad, Maus in Grad je Pixel
FreeCamSpeed = 15
FreeCamFast = 10
FreeCamFov = 75
FreeCamMouse = 0.15

; ---- Menükamera ----
; Im Menü mit 3D-Raum (Hauptmenü/Garage, Händler, Streckenwahl …) rechte Maustaste halten: Maus = Blick,
; Tasten wie die Freecam: Numpad 8/5/4/6 vor/zurück/links/rechts, 9/3 hoch/runter, 7/1 Blick hoch/runter,
; Numpad / und * Blick links/rechts, Mausrad vor/zurück; Umschalt x4, Strg x0,2.
; Losgelassen bleibt die Kamera stehen. Numpad 0 oder mittlere Maustaste = zurück zur Kamera des Spiels
; (auch bei jedem Menüwechsel, siehe MenuCamKeep).
; 1 = an, 0 = aus (die rechte Maustaste geht dann wie bisher an das Menü)
MenuCam = 1
; Tempo in m/s, Maus in Grad je Pixel (negativ = links/rechts umgekehrt)
MenuCamSpeed = 2
MenuCamMouse = 0.2
; 1 = die Drehscheibe (Auto dreht sich, Licht/Schatten, Bühne beim Händler) hält an, solange die Kamera frei ist
MenuCamStopSpin = 1
; 1 = Kamera bleibt beim Menüwechsel stehen, solange der 3D-Raum gleich bleibt; 0 = jedes Menü beginnt mit der Kamera des Spiels
MenuCamKeep = 0

; ---- Motorgeräusch in der Innenansicht ----
; so viel lauter (Anteil, 0.6 = +60 %) bei ganz offenem Verdeck bzw. ganz offenen Fenstern, 0 = aus
EngineRoofBoost = 0.6
EngineWindowBoost = 0.25

[Traffic]
; Messung (Phase 12): Rennaufbau, Verkehrsmodelle und Simulationsautos ins lfsp.log (1 = an, 0 = aus)
Measure = 1
; Verkehrsmodelle zufällig mischen statt fest aus der Strecke (1 = an, 0 = Spiel)
RandomModels = 1
; Pool der Verkehrsmodelle, Namen mit Komma getrennt (leer = alle 16):
; EAS1 … EAS11, Eden 1 Traffic, Eden2 … Eden5
Models =
; Modelle nur auf Strecken, die sie selbst vorsehen (FEData/Data/nfs5.trk); EAS4 = Schneepflug (alps, monaco2)
TrackOnly = EAS4
; Anteil Porsches im Verkehr in Prozent (0 = nur Verkehrsmodelle, 100 = nur Porsches); zufällig aus allen
; vorhandenen Porsches, Lack aus Colours
Porsches = 0
; Verkehrsautos je Menüstufe (Spiel: Leicht 2, Mittel 5, Schwer 7). Höchstens 8; das Spiel kürzt auf
; 9 Autos gesamt, mit Gegnern oder Polizei also entsprechend weniger
Light = 2
Medium = 5
Heavy = 8
; Höchstens gleichzeitig fahrende Verkehrsautos (Spiel: 5). Die übrigen warten und setzen ein, sobald eines
; aus dem Bild fällt; mehr Verkehrsautos als hier verkürzen nur die Lücken
Active = 5
; Verkehr überholt über die Gegenfahrbahn (1 = Spiel). 0 = Verkehr bleibt auf seiner Seite: kein Nebeneinander-
; herfahren mit langsameren Autos und keine Unfälle mit Gegenverkehr; mehrspurig in einer Richtung bleibt Überholen möglich
Overtake = 0
; Abstand zum Vordermann (B31): Mindestlücke Stoßstange zu Stoßstange in Metern; die Fahrzeuglängen (Bus, Lkw)
; rechnet LFSP selbst ab. Darunter fällt der Verkehr zurück, darüber nähert er sich nur so schnell, wie er
; bremsen kann. 0 = Spiel (Verkehr fährt immer etwas schneller als der Vordermann und schiebt ihn)
FollowGap = 6
; Zusätzliche Zeitlücke in Zehntelsekunden × eigenes Tempo (10 = 1 s, bei 50 km/h also +14 m; 0 = nur FollowGap)
FollowTime = 10
; Lacke des Verkehrs (auch Porsches im Verkehr): RRGGBB:Gewicht, mit Komma getrennt; leer = Zufallsfarbe des
; Spiels. Vorgabe: Weiß, Schwarz, Silber, Grau, Dunkelgrau, Rot, Blau, Dunkelblau, Grün, Beige, Braun, Gelb
Colours = F2F2F0:18, 151515:17, B8BCC0:17, 75787C:12, 45484C:6, 9E1B1B:9, 2B4A80:7, 162444:5, 1E4D2B:4, C9B58C:2, 5A3E2B:1, D8B620:1
; Anteil in Prozent, der trotzdem die Zufallsfarbe des Spiels behält (0 = nur Lacke aus Colours)
ColourRandom = 10

[Cars]
; Höchstzahl der Autos im Rennen (Spiel: 9). Über 9 verlegt LFSP die Tabellen pro Auto in eigenen Speicher
; (doc/VERKEHR.md §6.6). Erst nur für Verkehr gedacht; höchstens 16. Gespeicherte Wiederholungen enthalten
; nur die ersten 9 Autos. dx11z und nfs5_enhanced müssen die Version mit LfspCarList haben.
MaxCars = 9
; LodMeasure: jeder Wechsel der Detailstufe eines Autos mit Abstand zum Spieler ins Log (1 = an)
LodMeasure = 0

; Die Fenster-Tabelle (offene Scheiben je Fahrzeug) ist fest eingebaut. Ein Abschnitt [Windows] mit
; Fahrzeug.N = außen,innen ersetzt einzelne Einträge (siehe doc/FENSTER-VERDECK.md).

[Damage]
; Auspuffrauch bei Motorschaden: jedes Auto mit beschädigtem Motor zieht Rauch aus dem Auspuff (Partikelsystem
; VehicleExhaust des Spiels). Motorschaden 0..300 (300 = Motor tot). 1 an, 0 aus.
ExhaustSmoke = 1
; Rauch ab diesem Motorschaden, volle Stärke ab ExhaustSmokeFull
ExhaustSmokeStart = 45
ExhaustSmokeFull = 200
; Rauchmenge (Faktor auf die Emissionsrate des Systems) bei Start und bei voll
ExhaustSmokeMin = 0.25
ExhaustSmokeMax = 1.0
; Lage in Metern: hinter der Mitte der Hinterachse, seitlich, Höhe gegenüber der Radmitte
ExhaustBack = 0.9
ExhaustSide = 0.35
ExhaustHeight = -0.05

[SimTrace]
; Messwerkzeug (Reverse Engineering): zählt, welcher Code bis zu 4 Felder der carSpecs (Kopie der .sim am Auto)
; liest oder schreibt, per Hardware-Haltepunkt. Ausgabe lfsp_simtrace.log neben lfsp.asi, Auswertung mit
; simtrace_report.py (doc/TOOLS.md). Kostet im Rennen etwas Zeit je Zugriff. 1 = an, 0 = aus (nichts aktiv)
Enabled = 0
; Offsets in den carSpecs (Hex, durch 4 teilbar, höchstens 4)
Fields = 0x134,0x138,0x13C,0x144
; 0 = Spielerauto, n = Platz n in der Liste der Rennautos
Car = 0
; Tabelle alle so viele Sekunden und beim Verlassen des Rennens schreiben
DumpSeconds = 10

[Debug]
; Polizei in jedem Rennen erzwingen, auch im Schnellen Rennen (Test der Polizei-Stellen .cop, doc/re/FORMATE.md
; Test 19). Das Menü des Spiels setzt Polizei sonst nur in einzelnen Veranstaltungen. 1 = an, 0 = aus
ForceCops = 0
; Zustand der Scheibentropfen (Regen/Schnee) jede Sekunde ins lfsp.log schreiben (Messung, doc/re/13-VIDEO.md). 1 = an
WeatherLog = 0
; Menü- und Modusvariablen (FEGAME_TYPE, RACE_TYPE, Menü-Code, Car Chrome/Detail, COPS) bei jeder Änderung ins
; lfsp.log schreiben (doc/re/OFFEN.md Prüfzeilen 10, 11, 14). 1 = an
StateLog = 0

[Weather]
; Farbe der aufgewirbelten Gischt bei Nässe als RGB hex (B29; Original 599BD0, hellblau), leer = Original
SprayColour = B4BCC4
; Wetter im Rennen (doc/re/13-VIDEO.md §8). 1 = an, 0 = alles hier aus (Spiel wie original)
Enabled = 1
; 0 = Original (Regen/Schnee wie die Strecke vorsieht), 1 = Regen, 2 = Schnee, 3 = Zufall (je Rennstart neu aus
; Original, Regen, Schnee, mit RandomStorm auch Sturm und Gewitter), 4 = Sturm, 5 = Gewitter.
; Der Menüpunkt „Wetter“ in der Streckenwahl schreibt diesen Wert.
Mode = 0
; Tageszeit: 0 = Original (wie das Spiel), 1 = Tag, 2 = Nacht, 3 = Zufall (je Rennstart Tag oder Nacht).
; Der Menüpunkt „Tageszeit“ in der Streckenwahl schreibt diesen Wert.
TimeMode = 0
; Nacht auf einer Tagstrecke: Welt (samt Nebel und Himmel) abdunkeln, in dx11z (1 = an, 0 = nur Nachtflag). Wirkt nur bei
; TimeMode 2 oder 3 und nur auf Strecken, die das Spiel nicht selbst bei Nacht zeigt.
NightGrade = 1
; Helligkeit der Welt bei Nacht je Farbkanal als RRGGBB (FFFFFF = keine Änderung; bläulich dunkel)
NightLight = 38466F
; Himmel (Kuppel, Wolken, Meeresspiegelung) bei Nacht auf einer Tagstrecke: Anteil 0…1 des Abdunkelns der Welt (0 = Himmel bleibt, 1 = so dunkel wie die Welt)
SkyDarken = 0.6
; Leuchtsprites (Flares, Laternen, Fahrzeuglicht-Sprites; additiv gezeichnet) bei Nacht auf einer Tagstrecke: Helligkeitsfaktor (1 = wie das Spiel)
NightLightBoost = 1.6
; Kante von Laub und Büschen bei Nacht auf einer Tagstrecke (und bei Tag-Licht): das Licht der Scheinwerfer wird auf dem schwachen Alpha-Rand
; (Alpha unter AlphaEdgeRef) ausgeblendet, sonst gelb-oranger Saum um Blätter, in dx11z (1 = an, 0 = wie bisher)
NightEdgeLight = 1
; Strecken, die das Spiel selbst bei Nacht zeigt (dort kein Abdunkeln), durch Komma getrennt, Name aus Game_gTrackName
NightTracks = monaco3
; Menüpunkt „Wetter“ in der Streckenwahl (Ortseinstellungen / location setup). 1 = an
Menu = 1
; Lage des Menüpunkts (x,y; 377,71 = unter „records…“), leer = in diesem Bildschirm keiner
MenuPosLocation = 377,71
MenuPosQuickRace =
; Lage des Menüpunkts „Tageszeit“ (428,95 = eine Zeile unter „Wetter“, 51 weiter außen wie die Treppe links), leer = in diesem Bildschirm keiner
MenuPosTimeLocation = 428,95
MenuPosTimeQuickRace =
; Stärke 0…1 bei Regen bzw. Schnee aus dem Menü
RainAmount = 0.8
SnowAmount = 0.8
; Kein Niederschlag unter Brücken und in Tunneln: Fläche der Strecke über der Kamera. 1 = an
Cover = 1
; Sekunden, bis der Niederschlag beim Hineinfahren ganz weg ist (und beim Hinausfahren wieder da)
CoverFade = 0.7
; Fläche zählt, wenn sie so viele Meter über der Kamera liegt (mindestens/höchstens)
CoverMin = 0.3
CoverMax = 60
; bei der Einfahrt so viele Sekunden vorausschauen (die Regentropfen in der Luft brauchen Zeit zum Fallen)
CoverAhead = 0.8
; Scheibentropfen wandern mit dem Fahrtwind über die Scheibe. 1 = an
Drops = 1
; Tempo bei vollem Fahrtwind in Scheibenhöhen je Sekunde (negativ = andere Richtung)
DropWind = 0.5
; Fahrtwind setzt bei DropWindStart km/h ein und ist ab DropWindFull km/h voll
DropWindStart = 30
DropWindFull = 150
; seitlich der Mitte laufen die Tropfen beim Fahrtwind etwas nach außen (0 = gerade nach oben)
DropSpread = 0.25
; große Regentropfen rutschen im Stand langsam nach unten (Scheibenhöhen je Sekunde), 0 = aus
DropSlide = 0.04
; jede Sekunde Modus, Stärke und Abdeckung ins lfsp.log (Messung), dazu jeder Blitz. 1 = an
Log = 0
; ---- Sturm und Gewitter (PLAN.md 15.2) ----
; „Sturm“ und „Gewitter“ im Menüpunkt „Wetter“ (Mode 4 und 5). 1 = an, 0 = Menü wie bisher (Original, Regen, Schnee, Zufall)
Storm = 1
; Zufall (Mode 3) würfelt auch Sturm und Gewitter. 1 = an, 0 = nur Original, Regen, Schnee
RandomStorm = 1
; Regenstärke 0…1 bei Sturm und Gewitter
StormRain = 1.0
; Helligkeit der Welt bei Sturm je Farbkanal als RRGGBB (FFFFFF = keine Änderung; etwas dunkler und kühler), in dx11z
StormLight = BDC4D1
; Helligkeit des Himmels (Kuppel, Wolken) bei Sturm als RRGGBB, in dx11z
StormSky = 9EA8BD
; Nebel bei Sturm: Exponent auf den Anteil, den man durch den Nebel sieht (1 = wie das Spiel, 2 = deutlich dichter), in dx11z
StormFog = 2.0
; Fahrtwind auf den Scheibentropfen bei Sturm: Faktor auf DropWind (1 = wie sonst)
StormDropWind = 1.8
; Blitze beim Gewitter: Sekunden zwischen zwei Blitzen (zufällig zwischen Min und Max)
LightningMin = 6
LightningMax = 20
; Helligkeit eines Blitzes: Welt bzw. Himmel werden um diesen Faktor heller (0 = kein Blitz), in dx11z, ohne HUD und Menü
LightningWorld = 1.6
LightningSky = 2.5
; Donner nach dem Blitz: Donnerschläge des Spiels (thunder_991…999 aus track.viv). 1 = an, 0 = aus
Thunder = 1
; Sekunden vom Blitz bis zum Donner (zufällig zwischen Min und Max; Entfernung des Blitzes)
ThunderDelayMin = 0.4
ThunderDelayMax = 2.8
; ---- Schnee-Weiß (PLAN.md 15.2) ----
; Bei Schnee (Menü „Schnee“ oder Schneestrecke) die Streckenflächen Richtung Weiß mischen: Anteil 0…1 (0 = aus), in dx11z.
; Auto, Himmel, Wasser, HUD und Menü bleiben. Braucht [Lights] Headlights 1 (Hook der Streckenzeichnung).
SnowWhite = 0.25
; dabei etwas entsättigen: Anteil 0…1
SnowDesaturate = 0.3
; Farbe des Schnees als RRGGBB
SnowColour = F0F5FF
; Schnee bevorzugt auf nach oben zeigenden Flächen: 0 = gleichmäßiger Schleier, 1 = nur Böden und Dächer, Wände frei
; (Flächennormale aus den Bildschirm-Ableitungen; braucht [Lights] HeadlightsDay 1)
SnowSlope = 0
; Testbild: 1 = Schneeanteil grau (weiß = voller Schnee), 2 = Flächennormale als Farbe (oben = grün),
; 3 = Autos: rot = Fläche zeigt nach oben (bekommt Schnee), blau = nach unten (braucht [CarReflections] Reflections). 0 = aus
SnowDebug = 0
; ---- Haftung bei Nässe und Schnee (PLAN.md 15.3) ----
; Das Originalspiel kennt keine nasse oder verschneite Fahrbahn (Haftung nur je Belag und Reifenart). 1 = eigene Faktoren an
; (Spieler und Gegner), 0 = wie das Spiel. Gilt bei Regen, Schnee, Sturm, Gewitter und auf Strecken mit Regen/Schnee im Wetter.
Grip = 0
; Haftung als Anteil der trockenen (1 = unverändert)
GripRain = 0.85
GripSnow = 0.7
GripStorm = 0.8
; Gegner fahren Kurven um √Faktor langsamer (Soll-Tempo der Renn-KI), Verkehr und Polizei über die Wetter-Schalter des
; Spiels (Kurventempo ×0,9). 1 = an, 0 = nur die Haftung (Gegner fliegen dann öfter ab)
GripAi = 1
; ---- Schnee und Tropfen auf dem Auto (PLAN.md 15.3, in dx11z, braucht [CarReflections] Reflections) ----
; Schnee auf Dach, Haube und Kofferraum: Höchstanteil 0…1 (0 = aus); Innenraum, Scheiben und matte Teile bleiben frei
CarSnow = 0.5
; Sekunden Schneefall bis zum Höchstanteil, Sekunden bis er ohne Schnee wieder weg ist (bei Regen doppelt so schnell)
CarSnowTime = 180
CarSnowMelt = 240
; Regentropfen auf dem Lack bei Regen, Sturm und Gewitter: Dichte 0…1 (0 = aus)
CarDrops = 0.6
; Sekunden, bis das Auto im Regen ganz nass ist bzw. ohne Regen wieder trocken
CarWetTime = 15
CarDryTime = 90
; Größe der Tropfen: Zellen je Meter auf dem Auto (größer = kleinere Tropfen; 110 = Mikrotropfen 1–2,5 mm, dazu wenige
; größere bis 4 mm). Am Auto selbst festgemacht (dx11z w3); bei Fahrt kriechen sie nach hinten, ab etwa 70 km/h als kurze
; Schlieren, ab etwa 130 km/h verschwinden sie von der Front (w5)
CarDropCells = 110
; Wie schnell die Tropfen bei Fahrt nach hinten kriechen: m/s je m/s über 8 m/s (29 km/h). 0.005 = 0,15 m/s bei 140 km/h,
; 0 = sie bleiben liegen. Jeder Tropfen lebt 5 bis 12 s, dann entsteht an anderer Stelle ein neuer (auch im Stand)
CarDropFlow = 0.005

[Wet]
; Nässe und Schneedecke der Strecke (doc/PLAN.md 16.1). LFSP rechnet sie im Spieltakt (64 Hz, steht in der Pause still)
; und gibt sie an dx11z weiter (LfspWeatherState). Sie gelten für die ganze Strecke: im Tunnel trocknet die Straße nicht.
; Noch ohne sichtbare Wirkung, dx11z schreibt die Werte nur ins Log (nasse Flächen kommen mit 16.2). 1 = an, 0 = aus
Enabled = 0
; Nässe 0…1: steigt im Regen um WetSpeed je Sekunde bis zur Regenstärke (0.1 = ganz nass in 10 s),
; fällt ohne Regen um DrySpeed je Sekunde (0.02 = trocken in 50 s)
WetSpeed = 0.1
DrySpeed = 0.02
; Nässe beim Rennstart, wenn es schon regnet (Regen ab 0.2)
StartWetness = 0.8
; Schneedecke 0…1: steigt bei Schnee um SnowSpeed je Sekunde bis zur Schneestärke, schmilzt ohne Schnee um
; MeltSpeed je Sekunde (bei Regen doppelt so schnell)
SnowSpeed = 0.01
MeltSpeed = 0.005
; Schneedecke beim Rennstart, wenn es schon schneit (Schnee ab 0.2)
StartSnowCover = 0.6
; Log: [Debug] WeatherLog = 1 (oder [Weather] Log = 1) schreibt je Sekunde eine Zeile „Naesse: …“ ins lfsp.log

[Coverage]
; Messwerkzeug (Reverse Engineering): Einmal-Haltepunkt am Anfang jeder Funktion aus List; der erste Aufruf wird mit
; Aufrufer und Spielzustand in Output geschrieben, danach läuft die Funktion ohne Kosten. Stellen, an denen ein Hook sitzt,
; bleiben aus. Auswertung mit work/re/coverage/coverage_report.py. 1 = an, 0 = aus
Enabled = 0
; Sekunden nach dem Start, bevor die Haltepunkte gesetzt werden (andere Mods setzen ihre Hooks beim Start)
Delay = 15
; Adressliste (je Zeile "ADRESSE NAME", hex) und Ausgabe, beide neben lfsp.asi
List = lfsp_coverage.txt
Output = lfsp_coverage.log

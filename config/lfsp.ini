; lfsp.ini - settings of LFSP (lfsp.asi) and of the effects the Direct3D 11 driver (drivers\dx11z.dll) draws for it.
; Lies next to lfsp.asi in the game folder. Driver switches (resolution, MSAA, window) are in nfs5_enhanced.ini [Dx11].
;
; How to read the comments:
;   Range    allowed values (values outside are clamped)
;   Default  the recommended value, as in the template config/lfsp.ini of the mod (a key missing from the file falls
;            back to the built-in value of the code, which can differ)
;   Cost     what the setting costs (GPU/CPU time, memory); not mentioned = free
; Switches: 1 = on, 0 = off. Colours: RRGGBB in hex. Texture hashes: hex as in the logs, separated by commas.
; Keys: a letter or digit (F, 7), F1..F24 or a hex virtual key (0x46). The game itself uses L (lights), T, W, E, C and others.
; Keep comments on their own lines, never behind a value.

[General]
; ==== Side windows and roof ====
; Key for the side windows and time for the full travel in ms. Default F, 1200
WindowKey = F
WindowTime = 1200
; Key for the roof (convertible, Targa, Speedster) and time for the full travel in ms. Default V, 2200
RoofKey = V
RoofTime = 2200
; Roof key also works in the menus. 0 = only in the race (the menu has its own button). Default 0
RoofKeyInMenu = 0
; In the race: 0 = only the own car, 1 = all cars (the menu always moves the car shown). Default 0
ApplyTo = 0

; ==== Sounds ====
; WAV or MP3, path relative to the game folder (if the file is missing the other extension is tried; empty = no sound)
RoofSoundOpen = lfsp_roof_open.wav
RoofSoundClose = lfsp_roof_close.wav
WindowSound = lfsp_window.wav
; Volume in percent, 0-100. Default 40 (roof), 50 (windows)
RoofVolume = 40
WindowVolume = 50

; ==== Window motion (advanced, in window heights) ====
; Side axis of the model data 0/1/2 = x/y/z and tilt while lowering: 1.0 = as measured, 0 = straight down,
; larger = further outwards. Default 0, 1.0
WindowSideAxis = 0
WindowTilt = 1.0
; Travel; a bit more than 1 so the top edge surely vanishes in the door. Default 1.05
WindowDepth = 1.05
; Share of the travel the whole pane sinks below the door edge before it is squeezed (larger can poke through the door
; panel). Default 0.33
WindowSink = 0.33
; Forward offset at the end (0 = none) and which way "forward" is on the z axis (-1 or 1). Default 0.15, -1
WindowForward = 0.15
WindowForwardSign = -1
; Up/down axis of the model data (0/1/2 = x/y/z) and which way "down" is (-1 or 1). Default 1, -1
WindowAxis = 1
WindowDownSign = -1
; 1 = windows slide into the door, 0 = switch at once. Default 1
WindowAnimate = 1

; ==== Diagnostics ====
; Log file lfsp.log with the measurements of LFSP. Default 1
Measure = 1
; Rebuild after switching windows or roof: 1 = part list, 2 = also redraw the texture pages. Default 1
RebuildMode = 1
; Geometry: 1 = refill the existing render layers, 2 = create them anew like the menu does (resets the parts, test only).
; Default 1
RebuildMethod = 1


[Lights]
; ==== Headlights (drawn by dx11z) ====
; 0 = as the game (light at the triangle corners), 1 = per pixel, 2 = both, for comparing. Default 1
Headlights = 1
; Headlights also light cars, signs and objects, not only the track. Default 1
HeadlightsObjects = 1
; Light map (greyscale BMP, bottom = in front of the car, top = far away), empty = the map of the game.
; drivers\headlights_original.bmp is the map of the game as a template.
HeadlightsMap = drivers\headlights_low.bmp

; ==== Headlights by day ====
; 0 = off, 1 = when the light switch is on, 2 = always. Default 1
HeadlightsDay = 1
; Brightness as a share of the night light (0-4), colour (the game: 808080) and range (0.25-4). Default 1.0, 808080, 0.9
HeadlightsDayStrength = 1.0
HeadlightsDayColour = 808080
HeadlightsDayRange = 0.9

; ==== High beam ====
; Hold the key; with the lights off it flashes the headlights
HeadlightsHighKey = K
; Height on walls (0.5-10, 2 = twice as high), brightness (0-4), range (1-4), width (0.25-2); each 1 = as the low beam.
; Default 1.5, 1.5, 1.5, 1.2
HeadlightsHighHeight = 1.5
HeadlightsHighStrength = 1.5
HeadlightsHighRange = 1.5
HeadlightsHighWidth = 1.2
; Fade between low and high beam in ms. Default 90
HeadlightsHighFade = 90
; Glow (lens flare) of the own headlights with high beam: brightness and size factor (1 = as low beam, up to 4). Default 1.6
HeadlightsHighGlow = 1.6
; Flashing opens the pop-up headlights (944, 928 ...), tail lights stay off. 0 = the covers stay shut. Default 1
HeadlightsFlashPopUps = 1

; ==== Light colour by model year (own car and opponents) ====
; 1 = on, 0 = the colour of the game or HeadlightsDayColour. Default 1
HeadlightsColourByYear = 1
; YearN = model year, colour RRGGBB, brightness (1.0 = as the game). Blended in between; before the first and after the
; last point that point applies. Only the hue of the colour counts, the brightness is the third value.
; Bulb 6 V (~2400 K), halogen H4 (~3100 K), improved halogen (~3400 K), xenon (~4500 K)
Year1 = 1950, FFA54F, 0.5
Year2 = 1975, FFC184, 0.8
Year3 = 1995, FFCC99, 1.0
Year4 = 1997, FFF0E0, 1.3

; ==== Opponent and traffic lights on the track ====
; Opponents light the track while their lights are on and intact. Default 1
HeadlightsOpponents = 1
; Brightness as a share of the own light (0-4) and range as a share of the light map (0.25-4). Default 0.8, 1.5
HeadlightsOpponentsStrength = 0.8
HeadlightsOpponentsRange = 1.5
; Traffic cars: weak forward light, share of the opponent light (0-4, 0 = off). Night races only, nearest first.
; Default 0.35
TrafficHeadlightGlow = 0.35
; Forward range of the traffic light as a share of the opponent range (0.1-2). Default 1.0
TrafficHeadlightRange = 1.0
; Most car lights on the track (opponents and traffic together, 1-16), nearest first, opponents before traffic.
; Cost: one light map lookup per pixel and light; lower it when the frame rate drops. Default 16
MaxCarLights = 16
; Radius around the camera in metres in which cars light the track (50-1000). Default 250
CarLightRadius = 250

; ==== Tail lights, brake lights, indicators ====
; Red glow behind every car, stronger when braking; indicators front and rear in their rhythm and colour;
; a damaged lamp does not glow. Default 1
TailGlow = 1
; Colour of tail and brake light. Default FF1A0A
TailGlowColour = FF1A0A
; Strength (0-4): with the lights off (0 = no glow), added with the lights on, added when braking, indicators.
; Default 0, 0.2, 0.3, 0.3
TailGlowStrength = 0
TailGlowLights = 0.2
TailGlowBrake = 0.3
TailGlowSignals = 0.3
; Reversing light (only cars with a reversing lamp, in the colour of the lamp), strength 0-4. Default 0.35
TailGlowReverse = 0.35
; Shape in metres: distance behind the car centre, falloff to the rear, distance of the lamps from the centre,
; width per lamp. Default 2.3, 1.5, 0.6, 0.5
TailGlowOffset = 2.3
TailGlowReach = 1.5
TailGlowWidth = 0.6
TailGlowSpread = 0.5
; Rear indicators blink in step with the front ones (the game blinks them in opposite phase). 0 = as the game. Default 1
SignalsInSync = 1
; Third brake light (centre, e.g. in the rear window) only when braking; the game also lights it as a tail light.
; 0 = as the game. Default 1
ThirdBrakeLightBrakingOnly = 1

; ==== HUD ====
; Speedometer and rev counter switch between day and night look with the light switch (L), not with flashing.
; 0 = as the game, by time of day. Default 1
InstrumentsFollowLights = 1

; ==== Rendering and performance ====
; Night on a day track: blended draws without depth writes (foliage fringe, distant bushes) are darkened too (1)
; or stay bright (0). Default 1
NightGradeBlended = 1
; Give a draw only the lights whose range touches its bounding sphere. Same picture, less pixel work. Default 1
LightCulling = 1
; Forced early depth test (no change in the picture, saves pixel work): 0 = off, 1 = draws without alpha test,
; 2 = also alpha tested draws whose texture cannot fail the test. Default 2
EarlyZ = 2
; With nfs5_enhanced.ini [Dx11] AlphaEdgeFix = 3 (alpha to coverage): only textures whose alpha is almost all 0 or 255
; (foliage, fences) use it. This is the largest share of texels with alpha 32-224 for that (0-1); above it the two pass
; way stays (water edges, shadows, smoke, glass). Default 0.12
AlphaCoverageMid = 0.12


[World]
; ==== Track detail ====
; 0 = as the game, 1 = always the finest level (no cracks far away), 2 = also never hide parts by distance
; (shows very distant parts too), 3 = always the coarsest level (test for B21). Default 1
TrackDetail = 1
; With TrackDetail = 1: range per track section x factor, against holes (1.0 = as the game; too large shows more
; distant parts). Cost: more drawn geometry. Default 1.6
TrackRange = 1.6

; ==== Culling and clipping ====
; Hand triangles at the screen edge to dx11z whole instead of cutting them on the CPU. 0 = as the game
; (1 disturbs the rear view mirror, the minimap and the ESC menu in replays). Default 0
GuardBand = 0
; Also draw objects just outside the picture (radius factor in the view test, for the water reflection at the edge;
; 1 = as the game). Cost: a few more draws. Default 2.0
CullRadiusScale = 2.0
; Clip rectangle widened by this share of the picture on each side (only with GuardBand = 1). Default 1
ClipMargin = 1

; ==== Textures and decals (dx11z) ====
; Skid marks pulled towards the camera by this share of their distance, so the road does not hide them (B22;
; 0 = as the game). Default 0.003
SkidDepthBias = 0.003
; Mip bias: above 0 picks the smaller mip level earlier, against shimmering fine textures at flat angles
; (0.5 = slightly, 1 = clearly softer; 0 = as the game). Only textures with mip levels, not HUD and menu. Default 0
TextureLodBias = 0
; Use mip levels also where the game switches the mip filter off. Default 0
ForceMips = 0

; ==== Distance measurement (dx11z) ====
; Key that switches the distance measurement on and off: cross hair at the mouse, distance in metres, the draws under
; it once a second in dx11z.log. A letter, INSERT, HOME, END, PAUSE or 0x..; empty = off. Default INSERT
DistanceKey = INSERT

; ==== Diagnostics for B21 (hole in the ground) ====
; 0 = off, 1 = track objects the game dropped into the log, key TrackDiagKey: level tables of the sections within
; 150 m, 2 = also draw them. Default 0
TrackDiag = 0
; Key for the level tables with TrackDiag (empty = none). Default G
TrackDiagKey = G
; Check the triangle clipper of the game, visible triangles it lost into the log. Default 0
ClipDiag = 0


[Water]
; ==== Water reflection ====
; Real reflection: objects are mirrored at the water plane and drawn again. 0 = as the game. Cost: the mirrored scene is
; drawn once more each frame (see the performance group). Default 1
Reflections = 1
; Opacity of the reflection on the water by day and at night/dusk (0-1; a missing night key uses the day value).
; Default 0.6, 0.6
ReflectionStrength = 0.6
ReflectionStrengthNight = 0.6
; Colour filter of the reflection (FFFFFF = unchanged, smaller = darker/tinted). Default C8D2DC
ReflectionTint = C8D2DC
; Fresnel: share of the reflection when looking straight down (0-1, 1 = equally strong everywhere). Default 0.3
ReflectionFresnel = 0.3
; Reflection when looking flat over the water (far away, horizon) rises to this strength (0-1, 1 = full like real
; water). Default 1
ReflectionGrazing = 1
; Blur of the reflection in pixels at 1080 lines (0-20, 0 = sharp). Default 3
ReflectionBlur = 3
; Where the mirrored scene is empty (never drawn) show the mirrored sky. Default 1
ReflectionSky = 1
; Draw the mirrored scene two sided: from below the mirror camera sees faces the game leaves out. Default 1
ReflectionTwoSided = 1
; Same water brightness everywhere (the game brightens it in a circle around the player): 0 = as the game,
; 1 = one average for the whole surface, 2 = base brightness (darkest quarter, matches the shore at dusk/night). Default 2
WaterEvenColour = 2

; ==== Textures ====
; Remove the game's baked, blurry reflection copies (0 = show them as well). Default 1
RemoveBakedReflections = 1
; Textures of these baked copies. Other translucent track parts (tree strips on rocks) stay
BakedTextures = 41C66523,92CDBBAB
; Textures of the water surface
WaterTextures = 28A6F8AA
; Distant sea: gets the reflection like water but does not count for the water plane (it is not flat everywhere)
FarWaterTextures = 28884AC8
; Textures that are never mirrored (empty = all are mirrored)
ReflectionSkip =

; ==== Shore and edges ====
; Shore textures: their transparent water part (alpha below 0.5) reflects too
ShoreTextures = 63B3CF44,A1C11FBF
; Fade the shore towards the water: alpha below this turns transparent (0-0.9, 0 = as the game). Default 0.27
ShoreFade = 0.27
; Transparent part of the shore textures takes the light colour of the water instead of the shore colour (0-1, 0 = off;
; against the shore/water edge at dusk; needs WaterEvenColour 1 or 2). Default 1
ShoreWaterLight = 1
; Fade the water surface out towards its far end: share of the water's view distance (0-0.9, 0 = hard edge). Default 0.3
FarFade = 0.3
; Where the water ends against open sky (map end, sea in the sky): blend over this many pixels at 1080 lines into the sky
; next to it (0-200, 0 = hard edge). Default 120
EdgeFade = 120

; ==== Waves ====
; Waves in the reflection: amplitude in pixels at 1080 lines (0-20, 0 = calm; used when ReflectionWorldWaves = 0).
; Default 1
ReflectionWaves = 1
; Waves fixed on the water, they stay in place when the camera turns (0 = waves in screen space). Default 1
ReflectionWorldWaves = 1
; Size of these waves: factor on the wave lengths (0.25-16; 1 = 0.65-3.5 m, 3 = 2-10 m, 5 = 3.3-17 m). Default 6
ReflectionWaveSize = 6
; Main direction of the waves in degrees (wind, swell). Default 35
ReflectionWaveDirection = 35
; Spread around the main direction (0-3; 0 = all parallel, 1 = natural, 2 = criss-cross). Default 1
ReflectionWaveSpread = 1
; Wave height in metres: crests hide the troughs behind them, far waves seem to rise (0-6, 0 = flat; about 1-2). Default 0
ReflectionWaveHeight = 0
; Slope of the waves (0-0.5; 0.03 = calm, 0.06 = light, 0.15 = rough). Default 0.06
ReflectionWaveSlope = 0.06
; Sun glint: strength of the sharp sparkle towards the sun (0-20, 0 = off, 3 = clear). Off at night and dusk. Default 3
ReflectionSunGlint = 3

; ==== Lights in the water ====
; Lamps, lights and light spots (additive draws) are mirrored in the water, boosted, with streaks downwards. Default 1
ReflectionLights = 1
; Boost of the mirrored lights (0-16, 1 = as bright as the lamp itself). Default 3
ReflectionLightBoost = 3
; Length of the streaks: step of the 6 samples in pixels at 1080 lines (0-40, 0 = no streaks). Default 6
ReflectionLightStreak = 6

; ==== Performance ====
; Resolution of the reflection as a share of the frame (0.25-1; 0.5 = half, faster). Default 0.5
ReflectionScale = 0.5
; Size of the sky image for the reflection: 1 = full, 0.5 = half (the sky is soft, half is enough). Default 0.5
ReflectionSkyScale = 0.5
; Mirrored scene with a lean shader without headlight, opponent and tail light loops (the reflection has no headlights
; anyway). Saves GPU time. Default 1
ReflectionSimpleShader = 1
; Parts smaller on screen than this many pixels (at 1440 lines, longest edge) are not mirrored (0-200, 0 = all).
; Parts fully below the water are always left out. Default 20
ReflectionMinSize = 20
; Reflection also in the rear view mirror. Cost: a second mirrored scene. Default 0
ReflectionMirrorView = 0

; ==== Debug ====
; Test picture: 1 = water without reflection magenta, filled with sky cyan, 2 = also the transparent shore part green,
; 3 = the blend at the sky edge (EdgeFade) blue to red, 4 = holes of the mirrored scene red. 0 = off. Default 0
ReflectionDebug = 0


[CarReflections]
; ==== Car reflections (dx11z) ====
; The paint is drawn a second time with the picture in the reflected direction over it (Fresnel: stronger at flat
; angles). Cost: one more pass over the car bodies and a frame copy (see the performance group). Default 1
Reflections = 1
; Opacity of the reflection at grazing angles (0-1). Default 0.5
Strength = 0.5
; Share when looking straight at the surface (0-1; paint about 0.05-0.2, chrome higher). Default 0.06
Reflectance = 0.06
; Transition between straight and flat view: exponent 1-8 (5 = physical, smaller = softer). Default 5
Fresnel = 5
; Blur: level of the blurred frame copy, 0-8 (0 = sharp mirror). Default 2.0
Blur = 2.0
; Strength of reflections pointing down (ground) 0-1, 1 = as strong as upwards. Default 0.35
Ground = 0.35

; ==== Highlights ====
; Boost bright reflections (lamps, bright sky, sun): factor (0-16, 0 = off) and brightness from which it boosts (0-1).
; Default 4, 0.75
HighlightBoost = 4
HighlightThreshold = 0.75

; ==== Clear coat ====
; Two layers like real car paint: on top the clear coat, sharp like glass (4 % from the front, almost all at flat
; angles), below it the base coat, soft and in the paint colour. 0 = one layer. Default 0
ClearCoat = 0
; Strength of the base coat (0-1), its extra blur in levels (0-6) and how much it takes the paint colour
; (0 = neutral, 1 = full). Default 0.2, 2.5, 0.7
BaseCoat = 0.2
BaseCoatBlur = 2.5
BaseCoatTint = 0.7

; ==== Normals ====
; Edge angle in degrees: faces that bend more are not averaged, beads and edges stay sharp (0-180, 0 = all averaged).
; Default 40
CreaseAngle = 40
; Normals in the space of the part: all faces of a part keep one orientation instead of each one turned to the camera,
; computed once per part. Calmer (no colour change at the outline when turning) and less CPU. Default 0
ObjectNormals = 0
; Centre seam: corners on the centre line of the car (where the mirrored halves meet) get no sideways normal, so bonnet
; and roof do not crease in the middle. Only with ObjectNormals = 1. Default 0
SeamFix = 0

; ==== Sky ====
; Above the picture bonnet and roof reflect the sky with gradient and clouds instead of one flat colour. Uses the sky
; image of the water reflection ([Water] ReflectionSky = 1); without water in view the flat colour stays. Default 1
Sky = 1
; The sky image only exists while water is in view, without it bonnet and roof would only mirror the grey fog colour
; and turn dull (B36). -1 = keep the last sky image until the end of the race, a number = keep it that many seconds
; and then fade out, 0 = switch at once. Default -1
SkyHold = -1
; Look the sky up by its direction in the world (horizon band of the game), so bonnet and roof keep their colour when
; the camera moves. Works without water in view. 0 = the sky image of the water reflection as before. Default 1
SkyByDirection = 1

; ==== Performance ====
; Renew the frame copy (resolve of the MSAA scene and its mip chain, once per frame) only every N frames (1-8; 1 = every
; frame). The reflection is blurred, so the older copy looks almost the same; at high speed it can lag. Default 1
UpdateInterval = 1
; Size of the frame copy: 1 = full resolution, 0.5 = half (faster, Blur compensates, the look stays). Default 0.5
SourceScale = 0.5
; Soft blur chain: the reflection from a separately soft filtered half size copy with 5 levels instead of the mip levels
; of the frame copy (softer, no block edges; Blur picks the level). Default 1
BlurChain = 1
; Parts smaller on screen than this many pixels (at 1440 lines, longest edge) get no reflection (0-400, 0 = all).
; Default 0
MinSize = 0

; ==== Parts and textures without reflection ====
; Textures without reflection; default: the light spots Y2T1/Y2T2 of the game
SkipTextures = 4A522215,984E4128
; Grilles and meshes without reflection: textures with at least this share of half transparent texels (0-1, 0 = off).
; Default 0.3
SkipAlphaMid = 0.3
; Matte parts (part number of the .crp as in the log "pass ... part T/V"; "T/V" for one variant only). Paint inside
; them still shines: triangles on spots of the paint texture that a shiny part uses or that have about the paint or
; stripe colours of the body (e.g. the tail next to the 356 roof, parts 37/41); the roof cloth on the same texture stays
; matte. Default: cloth tops 37/41, interior (9 driver, 24-26, 28-30, 43-46, 49, 56, 59), underbody 11/12, engine 15,
; boot 23/33
MatteParts = 9,11,12,15,23,24,25,26,28,29,30,33,37,41,43,44,45,46,49,56,59
; Keep the paint/cloth split of matte parts per car from the first time (B28): otherwise after damage a roof part of
; the 356 shines all over. Default 1
MatteKeep = 1
; Grey paint colours (trim, shadows) only count as paint in matte parts when they are the main colour (B28).
; 1 = all colours as before. Default 0
MatteGrey = 0
; Matte parts in which only clearly coloured spots shine (e.g. a red tail), cloth/grey/black stays matte (B28).
; 41 = the fixed roof the opponents drive (on the own car LFSP swaps it for the animated roof 37). Empty = off
MatteSolid = 41

; ==== Glass ====
; Glass parts reflect as a whole like glass, not like paint (35/47 side windows outside/inside, 48 windscreen inside,
; 50 rear window, 54 roof glass inside; empty = off). Windscreens in the paint texture (half transparent pixels) use the
; same glass values
GlassParts = 35,47,48,50,54
; Opacity of the glass reflection at flat angles (0-1, 0 = glass parts without reflection) and when looking straight
; at it (0-1). Default 0.5, 0.12
GlassStrength = 0.5
GlassReflectance = 0.12
; How much brighter the sky counts in glass than in the frame (1-8, 1 = off): without it the reflection of a grey sky
; over a light interior cannot be seen. Default 2
GlassSkyBoost = 2
; Parts without any reflection: lamps 19-21, door handle 40 (small grey details; empty = off)
SkipParts = 19,20,21,40

; ==== Debug ====
; View for checking: 0 = normal, 1 = normals, 2 = full reflected picture, 3 = Fresnel strength. Default 0
Debug = 0


[AmbientOcclusion]
; ==== AO (ambient occlusion, dx11z) ====
; Dark corners, gaps and contact shadows. Runs after world, cars and water, before the HUD, main view only.
; Cost: a few full screen passes, the largest effect has Quality, ShadingRate and HalfRes. Default 0
Enable = 0
; Strength 0-2 (above 1 the darkening gets steeper). Default 1.0
Amount = 1.0
; Radius: larger = wider shadows, fewer fine details (0.5-10). Default 1.893
SampleRadius = 1.893
; 1 = radius as a fixed share of the picture width (grows in the world with the distance), 0 = radius in metres
; (SampleRadius / 2). Default 1
IncreaseRadiusWithDistance = 1
; Distance in metres at which the AO has faded to half (1-20000); it is gone at about twice that distance.
; Replaces FadeDepth and FadeFarPlane of older files (still read when FadeDistance is missing). Default 250
FadeDistance = 250
; No AO where the fog of the game hides the scene (same formula as the fog). Default 0
FogFade = 0

; ==== Look ====
; Weighting of the directions: 0 = standard (approximation: road at flat angles too dark, walls seen from the front too
; bright), 1 = exact (shares of the cosine weighted solid angle, back face along the sample's own view ray). Default 0
Method = 0
; Thickness given to the objects (0.1-4, 1 = normal). Smaller = fewer dark halos behind thin things (poles, branches).
; Default 1.0
Thickness = 1.0
; Fill with Method 1 (0-1): near occluders count thicker, the shadow under the cars gets fuller; from half the radius
; normal thickness, so no halos around objects appear. 0 = off. Default 0.35
Fill = 0.35
; Angle threshold in degrees (0-30): flatter rises cast no shadow, against facet patterns on the road (B35). Default 10
AngleBias = 10
; Multi bounce: bright surfaces get darkened less and in their own colour. Default 0
MultiBounce = 0

; ==== Quality and performance ====
; 0 = low (fast), 1 = medium, 2 = high (more samples, slower). Default 1
Quality = 1
; 0 = every pixel every frame, 1 = half the pixels per frame in a checkerboard (faster, the other half keeps the value
; of the frame before). Default 1
ShadingRate = 1
; 1 = raw occlusion only for every second pixel in width and height (a quarter of the work), then brought to full size
; by depth; slightly softer at edges. Turns ShadingRate off. Default 0
HalfRes = 0
; 1 = far samples from a smaller copy of the depth (half to 1/16 size), faster with a large radius. Default 0
DepthMips = 0
; Filter 0 = off, 1 = one pass, 2 = two passes (softer, keeps edges). Default 2
FilterQuality = 2
; Smoothing over time: the result of the frame before follows the camera in the world and is blended in (calmer, also
; with low quality; with the checkerboard the skipped pixels are then reprojected correctly). Default 0
Temporal = 0
; Share of the frame before in that smoothing (0-0.97, larger = calmer but slower to react). Default 0.85
TemporalBlend = 0.85

; ==== Debug ====
; 1 = show only the AO (test picture). Default 0
Debug = 0


[Weather]
; ==== Weather in the race ====
; 1 = on, 0 = everything in this section off (the game as original). Default 1
Enabled = 1
; 0 = original (rain/snow as the track has it), 1 = rain, 2 = snow, 3 = random (each race start from original, rain,
; snow, with RandomStorm also storm and thunderstorm), 4 = storm, 5 = thunderstorm. The menu item "Weather" writes it.
Mode = 0
; Time of day: 0 = original, 1 = day, 2 = night, 3 = random (day or night at each race start). The menu item
; "Time of day" writes it.
TimeMode = 0
; Strength 0-1 of rain and snow chosen in the menu. Default 0.8, 0.8
RainAmount = 0.8
SnowAmount = 0.8
; Colour of the spray thrown up when wet (the game: 599BD0, light blue); empty = original
SprayColour = B4BCC4

; ==== Weather menu ====
; Menu items "Weather" and "Time of day" in the location setup. Default 1
Menu = 1
; Position (x,y) of "Weather" in the location setup and in Quick Race (377,71 = below "records..."); empty = none there
MenuPosLocation = 377,71
MenuPosQuickRace =
; Position of "Time of day" (428,95 = one row below "Weather"); empty = none there
MenuPosTimeLocation = 428,95
MenuPosTimeQuickRace =

; ==== Night on day tracks (dx11z) ====
; Darken the world (with fog and sky) at night on a day track. Only with TimeMode 2 or 3 and only on tracks the game
; does not show at night itself. 0 = only the night flag. Default 1
NightGrade = 1

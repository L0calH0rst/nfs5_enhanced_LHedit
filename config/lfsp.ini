; lfsp.ini – LFSP (Love for Speed Porsche), liegt neben lfsp.asi im Spielordner.
; Beschreibung: doc/FENSTER-VERDECK.md, doc/LICHT.md, doc/KAMERA.md, doc/BUGS.md
; Tasten: Buchstabe oder Ziffer (F, 7), F1..F24 oder Hexcode (0x46). Im Spiel belegt sind u. a. L (Licht), T, W, E, C.
; Fehlt ein Schlüssel, gilt die eingebaute Vorgabe (für LFSP die Werte dieser Vorlage).

[General]
; ---- Seitenscheiben und Verdeck ----
; Taste und Dauer für den ganzen Weg in ms
WindowKey = F
WindowTime = 1200
RoofKey = V
RoofTime = 2200
; Verdeck-Taste auch im Menü (0 = nur im Rennen, im Menü gibt es einen eigenen Knopf)
RoofKeyInMenu = 0
; Wirkung im Rennen: 0 = nur eigenes Auto, 1 = alle Autos (im Menü immer das gezeigte Auto)
ApplyTo = 0

; ---- Geräusche ----
; WAV oder MP3, Pfad relativ zum Spielordner (fehlt die Datei, wird die andere Endung versucht; leer = aus),
; Lautstärke in Prozent
RoofSoundOpen = lfsp_roof_open.wav
RoofSoundClose = lfsp_roof_close.wav
WindowSound = lfsp_window.wav
RoofVolume = 40
WindowVolume = 50

; ---- Experten: Bewegung der Scheibe (in Scheibenhöhen) ----
; Neigung beim Absenken: Querachse 0/1/2 = x/y/z; 1.0 = wie gemessen, 0 = senkrecht, größer = stärker nach außen
WindowSideAxis = 0
WindowTilt = 1.0
; Weg (etwas mehr als 1, damit die Oberkante sicher in der Tür verschwindet)
WindowDepth = 1.05
; Weg als Ganzes unter die Türkante, bevor die Scheibe gestaucht wird (größer kann durch das Türblech stechen)
WindowSink = 0.33
; Versatz nach vorn am Ende (0 = aus) und Richtung "vorn" auf der Längsachse z (-1 oder 1)
WindowForward = 0.15
WindowForwardSign = -1

; ---- Debug ----
; Messlog lfsp.log: 1 = an, 0 = aus
Measure = 1
; Neuaufbau nach dem Umschalten: 1 = Teile-Liste, 2 = zusätzlich Textur-Seiten neu zeichnen
RebuildMode = 1
; Geometrie: 1 = vorhandene Render-Schichten neu befüllen, 2 = neu anlegen wie das Menü (setzt die Teile zurück, nur Test)
RebuildMethod = 1
; Scheiben: 1 = in die Tür fahren, 0 = sofort umschalten
WindowAnimate = 1
; Achse "oben/unten" der Modelldaten (0/1/2 = x/y/z) und Richtung "unten" (-1 oder 1)
WindowAxis = 1
WindowDownSign = -1


[Lights]
; ---- Scheinwerfer (berechnet von drivers\dx11z.dll) ----
; 0 = wie das Spiel (Licht an den Ecken der Dreiecke), 1 = pro Pixel, 2 = beides zum Vergleich
Headlights = 1
; Bei Tag: 0 = aus, 1 = wenn der Lichtschalter an ist, 2 = immer
HeadlightsDay = 1
; Tag-Licht: Helligkeit als Anteil der Nacht (0-4), Farbe RRGGBB (Spiel: 808080), Reichweite (0.25-4)
HeadlightsDayStrength = 1.0
HeadlightsDayColour = 808080
HeadlightsDayRange = 0.9
; Lichtkarte (Graustufen-BMP, unten = vor dem Auto, oben = fern), leer = Karte des Spiels.
; drivers\headlights_original.bmp ist die Karte des Spiels als Vorlage.
HeadlightsMap = drivers\headlights_low.bmp
; Gegner beleuchten die Strecke, wenn ihr Licht an und heil ist (1 = an); Helligkeit als Anteil des eigenen Lichts (0-4)
HeadlightsOpponents = 1
HeadlightsOpponentsStrength = 1.0
; Scheinwerfer beleuchten auch Autos, Schilder und Objekte (1 = an, 0 = nur die Strecke, 2 = an und diese Flächen
; 4-fach hell zum Erkennen)
HeadlightsObjects = 1

; ---- Fernlicht ----
; Taste gedrückt halten; bei ausgeschaltetem Licht wirkt sie als Lichthupe
HeadlightsHighKey = K
; Höhenabzug (0.4 = reicht an Wänden 2,5-mal so hoch), Helligkeit (0-4), Reichweite (1-4) und Breite
; (je 1 = wie Abblendlicht), Überblenden in ms
HeadlightsHighHeight = 0.2
HeadlightsHighStrength = 1.3
HeadlightsHighRange = 1.4
HeadlightsHighWidth = 1.2
HeadlightsHighFade = 100
; Lichthupe öffnet die Klappscheinwerfer (944, 928 …), Heckleuchten bleiben aus (1 = an, 0 = Klappen bleiben zu)
HeadlightsFlashPopUps = 1

; ---- Rücklicht-Schein ----
; Roter Schein hinter jedem Auto, beim Bremsen stärker; Blinker vorn und hinten im Takt und in der Farbe ihrer
; Leuchte; eine beschädigte Leuchte strahlt nicht (1 = an)
TailGlow = 1
; Farbe RRGGBB (Rück- und Bremslicht); Stärke Rücklicht bei ausgeschaltetem Licht (0 = kein Schein), zusätzlich bei
; eingeschaltetem Licht, zusätzlich beim Bremsen, Blinker (0-4)
TailGlowColour = FF1A0A
TailGlowStrength = 0
TailGlowLights = 0.2
TailGlowBrake = 0.3
TailGlowSignals = 0.3
; Rückfahrlicht (nur Autos mit Rückfahrscheinwerfer, in der Farbe der Leuchte), Stärke (0-4)
TailGlowReverse = 0.35
; Form: Abstand hinter der Wagenmitte, Abfall nach hinten, Abstand der Leuchten von der Mitte, Breite je Leuchte
TailGlowOffset = 2.1
TailGlowReach = 1.5
TailGlowWidth = 0.6
TailGlowSpread = 0.5

; Blinker hinten im Takt der vorderen (das Spiel blinkt sie gegenphasig): 1 = an, 0 = wie das Spiel
SignalsInSync = 1

; 3. Bremslicht (mittig, z. B. im Heckfenster) nur beim Bremsen; das Spiel lässt es bei eingeschaltetem
; Licht als Rücklicht mitleuchten (1 = an, 0 = wie das Spiel)
ThirdBrakeLightBrakingOnly = 1

; ---- HUD ----
; Tacho und Drehzahlmesser: Tag-/Nachtfassung folgt dem Lichtschalter (L), nicht der Lichthupe
; (1 = an, 0 = wie das Spiel nach Tageszeit)
InstrumentsFollowLights = 1

; ---- Lichtfarbe nach Baujahr (eigenes Auto und Gegner) ----
; 1 = an, 0 = Farbe des Spiels bzw. HeadlightsDayColour
HeadlightsColourByYear = 1
; YearN = Baujahr, Farbe RRGGBB, Helligkeit (1.0 = wie das Spiel). Dazwischen wird überblendet, davor und danach gilt
; der erste bzw. letzte Punkt. Nur der Farbton zählt, die Helligkeit kommt aus dem dritten Wert.
; Glühlampe 6 V (~2400 K), Halogen H4 (~3100 K), Halogen verbessert (~3400 K), Xenon (~4500 K)
Year1 = 1950, FFA54F, 0.5
Year2 = 1975, FFC184, 0.8
Year3 = 1995, FFCC99, 1.0
Year4 = 1997, FFF0E0, 1.3


[World]
; Strecke: 0 = wie das Spiel, 1 = immer feinste Detailstufe (keine Risse in der Ferne),
; 2 = zusätzlich nichts nach Entfernung ausblenden (zeigt auch sehr ferne Teile), 3 = immer gröbste Stufe (Test B21)
TrackDetail = 1
; Bei TrackDetail = 1: Reichweite je Abschnitt x Faktor gegen Löcher (1.0 = wie das Spiel; zu groß zeigt mehr ferne Teile)
TrackRange = 1.5
; Diagnose B21: 0 = aus, 1 = verworfene Strecken-Objekte ins Log, Taste: Stufen-Tabellen der Abschnitte im Umkreis 150,
; 2 = zusätzlich zeichnen
TrackDiag = 0
TrackDiagKey = G
; Diagnose B21: Dreieck-Clipper gegenprüfen, verlorene sichtbare Dreiecke ins Log (1 = an, 0 = aus)
ClipDiag = 0
; DistanceKey: Taste schaltet die Entfernungsmessung (dx11z) an/aus: Fadenkreuz an der Maus, Abstand in Metern; Zeichen, INSERT, HOME, END, PAUSE oder 0x..; leer = aus
DistanceKey = INSERT
; GuardBand: Dreiecke am Bildrand ganz an dx11z geben statt auf der CPU zu schneiden (1 = an, für die Wasserspiegelung am Rand; 0 = wie das Spiel)
GuardBand = 1
; CullRadiusScale: Objekte knapp neben dem Bild trotzdem zeichnen (Radius-Faktor im Sichtfeld-Test, für die Wasserspiegelung am Rand; 1 = wie das Spiel)
CullRadiusScale = 2.0
; Clip-Rechteck der Polygone je Seite um diesen Anteil der Bildgröße erweitert, damit Teile neben dem Bild gespiegelt werden (0 = Bildrand, nur mit GuardBand = 1)
ClipMargin = 1


[Water]
; Echte Wasserspiegelung (B15): Objekte werden an der Wasserebene gespiegelt neu gezeichnet (1 = an, 0 = wie das Spiel).
; Braucht lfsp.asi ab v7f und dx11z mit Wasserspiegelung.
Reflections = 1
; Deckkraft der Spiegelung auf dem Wasser (0 … 1)
ReflectionStrength = 0.6
; Farbfilter der Spiegelung als RRGGBB (FFFFFF = unverändert, kleiner = dunkler/getönt)
ReflectionTint = C8D2DC
; Fertige, unscharfe Spiegel-Kopien des Spiels weglassen (1 = weg, 0 = zusätzlich zeigen)
RemoveBakedReflections = 1
; Texturen dieser Spiegel-Kopien (Hash aus dem Messlog, durch Komma getrennt). Andere halbtransparente
; Teile der Strecke (z. B. Baumstreifen auf Felsen) bleiben stehen
BakedTextures = 41C66523,92CDBBAB
; Texturen der Wasserfläche (Hash aus dem Messlog, durch Komma getrennt)
WaterTextures = 28A6F8AA
; Ufer-Texturen: ihr durchsichtiger Wasser-Teil (Alpha unter 0,5) spiegelt mit (Hash, durch Komma getrennt)
ShoreTextures = 63B3CF44
; Ufer zum Wasser hin ausblenden: Alpha unter diesem Wert wird durchsichtig (etwa die unteren 20 %; 0 = wie im Original)
ShoreFade = 0.27
; Wasserfläche zum fernen Ende hin ausblenden: Anteil der Sichtweite des Wassers, über den sie verläuft (0 = harte Kante)
FarFade = 0.3
; Wo die Wasserfläche gegen offenen Himmel endet (Kartenende, Meer im Himmel), über so viele Bildpunkte (bei 1080 Zeilen) in den Himmel daneben überblenden (0 = harte Kante)
EdgeFade = 120
; Texturen, die nicht gespiegelt werden (hex, durch Komma getrennt; leer = alle)
ReflectionSkip =
; Fernes Meer: bekommt die Spiegelung wie Wasser, zählt aber nicht für die Wasserebene (ist nicht überall flach; hex, durch Komma getrennt)
FarWaterTextures = 28884AC8
; Wo die gespiegelte Szene leer ist (nie gezeichnet), den gespiegelten Himmel zeigen (1 = an, 0 = aus)
ReflectionSky = 1
; Gespiegelte Szene beidseitig zeichnen: die Spiegel-Kamera sieht von unten Flächen, die das Spiel weglässt (1 = an, 0 = aus)
ReflectionTwoSided = 1
; Wellen in der Spiegelung: Ausschlag in Bildpunkten bei 1080 Zeilen (0 = ruhig)
ReflectionWaves = 1
; Unschärfe der Spiegelung in Bildpunkten bei 1080 Zeilen (0 = scharf)
ReflectionBlur = 3
; Auflösung der Spiegelung als Anteil der Bildauflösung (0.5 = halb, schneller; 1 = voll)
ReflectionScale = 0.5
; Fresnel: Anteil der Spiegelung beim Blick senkrecht von oben (1 = überall gleich stark)
ReflectionFresnel = 0.3
; Spiegelung beim Blick flach über das Wasser (Ferne, Horizont): Stärke, zu der sie dort ansteigt (1 = voll wie echtes Wasser, 0 = aus)
ReflectionGrazing = 1


[Camera]
; ---- Cinematic: Streckenkameras der Wiederholung, wechseln mit der Kamerazone ----
; 1 = fünfte Ansicht der Kamerataste des Spiels (C), 0 = nicht
CinematicInCycle = 1
; Eigene Taste zum Ein-/Ausschalten (leer = keine)
CinematicKey =

; ---- Action: Verfolgerkameras reagieren auf Kurve, Bremsen, Sprünge, Grund und Tempo ----
; 1 = an, 0 = aus; Taste zum Vergleichen an/aus (leer = keine)
Action = 1
ActionKey = J
; Kameratypen: 2, 3, 4 = Verfolger nah/mittel/fern, 5, 6, 7 = Heli nah/mittel/fern
ActionCams = 2, 3, 4
; Stärken, 0 = Effekt aus:
;   Side = Versatz in Kurven (Meter bei 1 g), Look = Blick in die Kurve (Grad bei 1 g), Height = höher als im Spiel (Meter),
;   Brake = Heranrücken beim Bremsen (Meter), Bounce = Mitschwingen bei Sprüngen, Fov = FOV-Zuwachs bei Tempo,
;   Shake = Wackeln auf unebenem Grund, Roll = Rollen zur Kurveninnenseite (Grad bei 1 g, negativ = nach außen),
;   Overshoot = Nachschwingen beim Einlenken (1 = Standard, 2 = stark), Impact = Stoß bei Aufprall und Landung
ActionSide = 1.0
ActionLook = 7.0
ActionHeight = 0.25
ActionBrake = 0.8
ActionBounce = 1.0
ActionFov = 0.20
ActionShake = 1.0
ActionRoll = 2.5
ActionOvershoot = 0.5
ActionImpact = 1.0
; Sekunden, bis der Kurven-Effekt aufgebaut ist (Tastatur: länger lenken = stärker)
ActionBuildUp = 1.2
; Kurven-Effekte bei hohem Tempo stärker (voll ab ~215 km/h, 0 = gleich stark)
ActionSpeedBoost = 0.35

; ---- Innenansichten (Cockpit, Stoßstange) ----
; FOV in Grad (Spiel: 75), 0 = nicht ändern
CockpitFov = 90

[Traffic]
; Messung (Phase 12): Rennaufbau, Verkehrsmodelle und Simulationsautos ins lfsp.log (1 = an, 0 = aus)
Measure = 1
; Verkehrsmodelle zufällig mischen statt fest aus der Strecke (1 = an, 0 = Spiel)
RandomModels = 1
; Pool der Verkehrsmodelle, Namen mit Komma getrennt (leer = alle 16):
; EAS1 … EAS11, Eden 1 Traffic, Eden2 … Eden5
Models =
; Modelle nur auf Strecken, die sie selbst vorsehen (FEData/Data/nfs5.trk); EAS4 = Schneepflug (alps, monaco2)
TrackOnly = EAS4
; Anteil Porsches im Verkehr in Prozent (0 = nur Verkehrsmodelle, 100 = nur Porsches); zufällig aus allen
; vorhandenen Porsches, Lack aus Colours
Porsches = 0
; Verkehrsautos je Menüstufe (Spiel: Leicht 2, Mittel 5, Schwer 7). Höchstens 8; das Spiel kürzt auf
; 9 Autos gesamt, mit Gegnern oder Polizei also entsprechend weniger
Light = 2
Medium = 5
Heavy = 8
; Höchstens gleichzeitig fahrende Verkehrsautos (Spiel: 5). Die übrigen warten und setzen ein, sobald eines
; aus dem Bild fällt; mehr Verkehrsautos als hier verkürzen nur die Lücken
Active = 5
; Verkehr überholt über die Gegenfahrbahn (1 = Spiel). 0 = Verkehr bleibt auf seiner Seite: kein Nebeneinander-
; herfahren mit langsameren Autos und keine Unfälle mit Gegenverkehr; mehrspurig in einer Richtung bleibt Überholen möglich
Overtake = 0
; Lacke des Verkehrs (auch Porsches im Verkehr): RRGGBB:Gewicht, mit Komma getrennt; leer = Zufallsfarbe des
; Spiels. Vorgabe: Weiß, Schwarz, Silber, Grau, Dunkelgrau, Rot, Blau, Dunkelblau, Grün, Beige, Braun, Gelb
Colours = F2F2F0:18, 151515:17, B8BCC0:17, 75787C:12, 45484C:6, 9E1B1B:9, 2B4A80:7, 162444:5, 1E4D2B:4, C9B58C:2, 5A3E2B:1, D8B620:1
; Anteil in Prozent, der trotzdem die Zufallsfarbe des Spiels behält (0 = nur Lacke aus Colours)
ColourRandom = 10

[Cars]
; Höchstzahl der Autos im Rennen (Spiel: 9). Über 9 verlegt LFSP die Tabellen pro Auto in eigenen Speicher
; (doc/VERKEHR.md §6.6). Erst nur für Verkehr gedacht; höchstens 16. Gespeicherte Wiederholungen enthalten
; nur die ersten 9 Autos. dx11z und nfs5_enhanced müssen die Version mit LfspCarList haben.
MaxCars = 9

; Die Fenster-Tabelle (offene Scheiben je Fahrzeug) ist fest eingebaut. Ein Abschnitt [Windows] mit
; Fahrzeug.N = außen,innen ersetzt einzelne Einträge (siehe doc/FENSTER-VERDECK.md).

; nfsp_texpool.ini - memory pools of the game (nfsp_texpool.asi), next to the game. Both pools count towards the 2 GB
; address space of the game.

[General]
; ==== Memory pools ====
; Size of the texture pool "DTEX" in races in MB, 24-1536 (the game: 24). A 1024x1024 texture with mips needs 5.6 MB.
; Cost: address space. Default 256
TexturePoolMB = 256
; Size of the main memory pool "RAM" in MB for the whole game from the start, 24-512 (the game: 24, 24 = unchanged).
; Among others the texture pages of the cars come from it while loading; when it is full the game crashes while loading.
; Cost: address space. Default 128
RamPoolMB = 128

; ==== Memory query ====
; With 4 GB RAM or more Windows reports 0xFFFFFFFF to the game, which reads that as "no memory" (coarser cars, menu in
; lite mode, opponent choice without "random car", B27). 1 = report at most 2 GB, 0 = original. Default 1
TotalPhysFix = 1

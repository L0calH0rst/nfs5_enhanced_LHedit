; Größe des Hauptspeichers „RAM“ in MB (ganzes Spiel, ab Start). Original 24. Daraus kommen u. a. die
; Texturseiten der Autos beim Laden; ist er voll, stürzt das Spiel beim Laden ab.
; Zählt ebenfalls zum Adressraum. Erlaubt 24 bis 512, 24 = unverändert.
